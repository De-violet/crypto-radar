name: Serverless Market Scanner (Cron)

on:
  schedule:
    # Berjalan setiap 30 menit (jadwal cron GitHub Actions)
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    name: 🎯 Scan Market & Alert Telegram
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Run Scanner One-Shot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_LIMIT: ${{ vars.SCAN_LIMIT || '100' }}
          VOL_SPIKE_THRESHOLD: ${{ vars.VOL_SPIKE_THRESHOLD || '1.5' }}
          COOLDOWN_HOURS: ${{ vars.COOLDOWN_HOURS || '4.0' }}
          STRATEGIES: ${{ vars.STRATEGIES || '' }}
        run: |
          python main.py --once

      - name: 💾 Commit updated anti-spam memory
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alerted_coins.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(memory): update anti-spam memory [skip ci]" && git push)

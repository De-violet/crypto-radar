name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: 🚀 Deploy to Fly.io
    runs-on: ubuntu-latest
    # Only deploy if tests pass (this workflow depends on tests workflow)
    needs: []
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 🔍 Lint check (gate)
        run: ruff check .

      - name: 🧪 Run tests (gate)
        run: pytest tests/ -v --tb=short --maxfail=5

      - name: 🐳 Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 🚀 Deploy to Fly.io
        run: flyctl deploy --remote-only --strategy=rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: ✅ Verify deployment
        run: |
          sleep 10
          curl -fsS "https://crypto-radar.fly.dev/health" | python3 -m json.tool || \
            echo "⚠️  Health check failed — check Fly.io dashboard"

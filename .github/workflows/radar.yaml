name: Crypto Radar Bot

on:
  schedule:
    # Berjalan otomatis setiap 4 jam sekali
    - cron: '0 */4 * * *'
  workflow_dispatch: # Memunculkan tombol "Run workflow" untuk tes manual

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modul
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas==2.2.2
          pip install https://github.com/twopirllc/pandas-ta/archive/master.zip

      - name: Jalankan Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python radar.py
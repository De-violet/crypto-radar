name: Crypto Anomaly Radar

on:
  schedule:
    # Jalanin setiap 30 menit (menggunakan format cron)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Biar lu bisa jalanin manual dari tombol di web GitHub

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Modul (Requests)
        run: pip install requests
        
      - name: Jalankan Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py

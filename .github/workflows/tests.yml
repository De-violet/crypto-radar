name: Tests & Validation

on:
  push:
    branches: [main, web]
  pull_request:
    branches: [main, web]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Run pytest + lint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 🔍 Lint with ruff (blocking)
        run: ruff check .

      - name: 🧪 Run pytest
        run: pytest tests/ -v --tb=short --maxfail=5

      - name: 📊 Generate coverage report
        run: pytest tests/ --cov=. --cov-report=term-missing --cov-report=xml
        continue-on-error: true

      - name: 📤 Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  backtest-validation:
    name: 📊 Backtest Validation (BTC 7 days)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📊 Run backtest on BTCUSDT (7 days, all strategies)
        run: python backtest.py --symbol BTCUSDT --days 7 --strategy all --no-save

      - name: 📊 Run backtest on ETHUSDT (7 days, reversal only)
        run: python backtest.py --symbol ETHUSDT --days 7 --strategy reversal --no-save

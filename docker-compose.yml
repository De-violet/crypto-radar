services:
  crypto-radar:
    build: .
    container_name: crypto-radar-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistensi data anti-spam
      - ./alerted_coins.json:/app/alerted_coins.json
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

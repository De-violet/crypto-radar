# ══════════════════════════════════════════════
# Crypto Radar v7.0 — Fly.io configuration
# ══════════════════════════════════════════════
# Deploy ke Fly.io via:
#   fly deploy          # manual
#   atau push ke GitHub main → auto-deploy via .github/workflows/fly-deploy.yml
#
# Setup sekali (lokal):
#   fly launch --no-deploy
#   fly secrets set DISCORD_TOKEN=xxx
#   fly secrets set DISCORD_NEWS_CHANNEL_ID=xxx
#   fly secrets set DISCORD_ALERT_CHANNEL_ID=xxx
#   fly secrets set SUPABASE_URL=xxx
#   fly secrets set SUPABASE_ANON_KEY=xxx
#   fly secrets set SUPABASE_SERVICE_ROLE_KEY=xxx
#   fly secrets set API_INTERNAL_TOKEN=$(openssl rand -hex 32)
# ══════════════════════════════════════════════

app = "crypto-radar"
primary_region = "sin"  # Singapore — paling dekat dengan Binance API Asia
kill_signal = "SIGINT"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  MPLBACKEND = "Agg"

# Free tier: shared-cpu-1x 256MB
# Bisa di-upgrade ke 512MB kalau OOM (free tier Fly.io tetap 256MB)
[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# HTTP service: expose FastAPI di port 8080
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # jangan stop — Discord bot harus always-on
  auto_start_machines = true
  min_machines_running = 1    # minimal 1 mesin always-on

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 50

# Health check ke FastAPI /health
[[http_service.checks]]
  interval = "60s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

# Custom domain (setup setelah deploy pertama berhasil):
#   fly certs add api.yourdomain.com
#   lalu set CNAME di Cloudflare DNS ke crypto-radar.fly.dev
